<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot</title>
<script src="https://cdn.tailwindcss.com?plugins=typography"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex antialiased">

<aside class="w-64 bg-white border-r border-slate-200 p-4 flex flex-col">
  <button id="new-chat-btn"
    class="w-full mb-5 py-2 text-sm font-medium bg-slate-900 text-white rounded-lg hover:bg-slate-700 transition">
    + New chat
  </button>

  <h3 class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-2">Files</h3>
  <div id="uploaded-files" class="mb-5 space-y-1.5"></div>

  <h3 class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-2">History</h3>
  <div id="chat-history" class="flex-1 overflow-y-auto space-y-1"></div>
</aside>

<main class="flex-1 flex flex-col min-w-0">
  <header class="px-6 py-3.5 bg-white border-b border-slate-200">
    <h1 class="text-base font-semibold text-slate-900">Chatbot</h1>
  </header>

  <div id="chat-container"
    class="flex-1 overflow-y-auto py-6 space-y-5 px-[max(1.5rem,calc((100%-48rem)/2))]"></div>

  <div id="upload-status" class="text-xs px-6 pb-1 min-h-[1.25rem] mx-auto w-full max-w-3xl"></div>

  <div class="px-6 pb-6">
    <div class="mx-auto max-w-3xl flex items-center gap-2 bg-white border border-slate-200 rounded-xl px-3 py-2 shadow-sm focus-within:border-slate-400 transition">
      <button id="file-upload-btn" title="Add files"
        class="w-8 h-8 flex items-center justify-center text-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition">+</button>
      <input type="file" id="hidden-file-input" style="display:none;" />
      <input id="user-input" type="text" placeholder="Ask anything..."
        class="flex-1 bg-transparent px-1 py-1.5 text-sm focus:outline-none placeholder-slate-400" />
      <button id="send-btn"
        class="px-4 py-1.5 text-sm font-medium bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">Send</button>
    </div>
  </div>
</main>

<script src="./script.js"></script>
</body>
</html>
